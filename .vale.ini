# Minimal Vale/alex config for traefik/traefik (Proxy) docs — added as a
# proof-of-concept for the doc-content-reviewer plugin demo and for the
# Proxy/Hub docs-as-a-system unification initiative (see automation
# workspace CLAUDE.md, initiative 2/3).
#
# Reuses hub-doc's "traefik" custom style + alex wholesale (copied verbatim
# from hub-doc/.github/vale/traefik and hub-doc/.alexrc.yaml) rather than
# writing a separate rule set — the two doc systems are meant to converge on
# one style, so starting from a fork rather than a fresh minimal set is more
# representative of where this is headed. Joblint (careers-page rules, not
# relevant to product docs) is deliberately omitted.
StylesPath = .github/vale
MinAlertLevel = warning # suggestion, warning or error
Packages = alex

# Formats and aliases - treat mdx as markdown (traefik docs are plain .md,
# kept for parity with hub-doc's config in case mdx shows up later).
[formats]
mdx = md

[docs/content/**/*.md]
BasedOnStyles = traefik, alex

# Same overrides as hub-doc — Spelling/Commas/HeadingPunctuation not in use yet.
traefik.Spelling = NO
traefik.Commas = NO
traefik.HeadingPunctuation = NO
